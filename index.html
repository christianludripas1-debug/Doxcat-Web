<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DOXCAT BOHOL</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#050505,#111,#1b1b1b);
overflow:hidden;
color:#fff;
}

body::before{
content:"";
position:absolute;
width:350px;
height:350px;
background:#ffffff10;
border-radius:50%;
filter:blur(120px);
top:-100px;
right:-100px;
}

body::after{
content:"";
position:absolute;
width:300px;
height:300px;
background:#00bfff15;
border-radius:50%;
filter:blur(120px);
bottom:-80px;
left:-80px;
}

.container{
position:relative;
text-align:center;
z-index:2;
padding:40px;
width:90%;
max-width:700px;
}

h1{
font-size:65px;
font-weight:900;
letter-spacing:3px;
text-transform:uppercase;
text-shadow:0 0 15px rgba(255,255,255,.3);
}

.subtitle{
margin-top:15px;
font-size:20px;
color:#cfcfcf;
}

button{
margin-top:45px;
padding:18px 70px;
font-size:30px;
font-weight:bold;
background:#fff;
color:#000;
border:none;
border-radius:10px;
cursor:pointer;
transition:.25s;
box-shadow:0 0 25px rgba(255,255,255,.25);
}

button:hover{
transform:translateY(-3px);
box-shadow:0 0 40px rgba(255,255,255,.5);
}

#msg{
margin-top:30px;
font-size:24px;
font-weight:bold;
color:#00ff99;
}
</style>
</head>

<body>

<div class="container">

<h1>WELCOME TO<br>DOXCAT BOHOL</h1>

<div class="subtitle">
Secure Access Portal
</div>

<button onclick="accessPortal()">
ACCESS
</button>

<div id="msg"></div>

</div>

<script>
function accessPortal(){
document.getElementById("msg").textContent = "Front Test Only";
}
</script>

</body>
</html>
